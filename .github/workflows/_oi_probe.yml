name: OI source probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate OI sources
        run: |
          python3 - << 'EOF'
          import urllib.request

          CANDIDATES = {
              "okx": "https://www.okx.com/api/v5/public/open-interest?instType=SWAP&instId=SOL-USDT-SWAP",
              "bitget": "https://api.bitget.com/api/v2/mix/market/open-interest?symbol=SOLUSDT&productType=USDT-FUTURES",
              "gateio": "https://api.gateio.ws/api/v4/futures/usdt/contract_stats?contract=SOL_USDT&interval=15m&limit=2",
              "kucoin": "https://api-futures.kucoin.com/api/v1/ticker?symbol=SOLUSDTM",
          }

          for name, url in CANDIDATES.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      body = resp.read()[:300]
                  print(f"{name}: HTTP {resp.status} -- {body}")
              except Exception as e:
                  print(f"{name}: ERROR {e}")
          EOF
