name: Multi-market monitor

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler doesn't guarantee the exact
    # minute under load, but it's reliably in the ballpark.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 monitor.py

      - name: Commit updated state
        run: |
          git config user.name "btc-monitor-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "Update state [skip ci]"
            git push
          fi
