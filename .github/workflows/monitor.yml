name: Multi-market monitor

# Overlapping runs (native schedule + external cron-job.org triggers,
# often seconds apart) were racing to commit state.json -- the loser of
# each race got its changes silently discarded on `git pull --rebase`,
# which is why setup_log entries were firing correctly (real alerts
# went out) but never actually persisting. Serializing runs into a
# single queue removes the race entirely instead of retrying around it:
# each run starts from a checkout that already includes every prior
# run's committed state, so there's nothing left to race against.
concurrency:
  group: monitor-bot-state
  cancel-in-progress: false

on:
  schedule:
    # Every 15 minutes: the regular crypto/US/India monitor loop.
    - cron: "*/15 * * * *"
    # India opening-range scan: 9:15-9:45 IST just closed -> pick the
    # day's top 15 movers. 9:50 IST = 4:20 UTC, weekdays only.
    - cron: "20 4 * * 1-5"
    # US opening-range scan: 9:30-10:00 AM ET just closed (EDT, summer)
    # -> 7:35 PM IST = 14:05 UTC, weekdays only. NOTE: shifts an hour
    # during US winter (EST) -- nudge this cron by +1h around the DST
    # transitions (~early Nov, ~early Mar) if the scan starts firing
    # before the US market actually opens.
    - cron: "5 14 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "monitor / india / us / report / ideas / eia (for manual testing; news briefing always runs)"
        required: false
        default: "monitor"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # These three used to gate purely on `github.event.schedule` matching
      # an exact cron string -- which is ONLY ever set for a native GitHub
      # `schedule` trigger. Every run is actually arriving via the external
      # cron-job.org backup (workflow_dispatch, per the concurrency comment
      # above) -- confirmed directly: 0 of the last 71 runs today were
      # schedule-triggered, all workflow_dispatch. That silently disabled
      # all three: no India/US opening-range refresh all day (explains a
      # user report of zero US alerts -- the day's active symbol list
      # never got refreshed), and "Trade performance report" was never
      # wired to run automatically AT ALL -- no schedule entry maps to
      # mode=report anywhere, so every report ever sent was a manual
      # workflow_dispatch during testing, not a real running automation.
      # Fix: check real wall-clock UTC time instead of the trigger type,
      # so it works whether the schedule or the cron-job.org backup
      # delivered this run. `mode=X` still force-runs it for manual testing
      # regardless of time.
      # continue-on-error on all four steps below: none of them are the
      # bot's actual job (finding setups and alerting on them) -- they're
      # auxiliary features that should never be able to take the real
      # scan down. Confirmed directly: news_briefing.py returning exit 1
      # on a harmless "no headlines this cycle" condition (not a real
      # error) skipped every step after it in the job, including "Run
      # monitor (full scan)" -- 3 full scans today ran zero real trading
      # logic and fired zero alerts because of it. continue-on-error
      # still surfaces the failure (step shows as failed, still emails on
      # it) but no longer blocks anything downstream.
      - name: India opening-range scan
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          h=$((10#$(date -u +%H))); m=$((10#$(date -u +%M))); now=$((h*60+m)); wd=$(date -u +%u)
          # 9:50 IST = 4:20 UTC, weekdays only
          if [ "${{ github.event.inputs.mode }}" = "india" ] || { [ "$wd" -le 5 ] && [ "$now" -ge $((4*60+15)) ] && [ "$now" -lt $((4*60+30)) ]; }; then
            python3 rank_movers.py india
          else
            echo "Skipping (now=$now UTC, weekday=$wd, not in window and mode != india)"
          fi

      - name: US opening-range scan
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          h=$((10#$(date -u +%H))); m=$((10#$(date -u +%M))); now=$((h*60+m)); wd=$(date -u +%u)
          # 10:05 AM ET (EDT) = 14:05 UTC, weekdays only -- nudge +1h
          # around US DST transitions (~early Nov, ~early Mar) same as
          # the old cron comment used to note.
          if [ "${{ github.event.inputs.mode }}" = "us" ] || { [ "$wd" -le 5 ] && [ "$now" -ge $((14*60)) ] && [ "$now" -lt $((14*60+15)) ]; }; then
            python3 rank_movers.py us
          else
            echo "Skipping (now=$now UTC, weekday=$wd, not in window and mode != us)"
          fi

      - name: World news briefing
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python3 news_briefing.py
        # Runs every scan now (no wall-clock window, unlike the
        # opening-range scans and report above) -- explicitly requested:
        # the bot should be "extremely aware" of world news as it
        # happens, not just once a day. Stays cheap and un-spammy on its
        # own: news_briefing.py fetches fresh headlines every time (free
        # either way) but only calls the LLM and sends a Telegram
        # message when at least one headline is genuinely new since the
        # last check (tracked by Finnhub's own id) -- most 15-min
        # windows won't have new world-news items, so this rate-limits
        # itself without an arbitrary schedule.

      - name: Community trade ideas
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 community_ideas.py
        # Runs every scan now (no wall-clock window), matching the news
        # briefing above -- explicitly requested: "the bot should scan
        # them itself in every 15 minutes". Only fires a real Telegram
        # alert when a genuine setup passes BOTH the LLM's writeup
        # judgment AND the bot's own RSI/ADX technical-agreement check
        # (see bot_agrees_with_direction() in community_ideas.py), so
        # this stays as quiet as any other real setup, not spammy.

      - name: EIA natural gas storage check
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          h=$((10#$(date -u +%H))); m=$((10#$(date -u +%M))); now=$((h*60+m)); wd=$(date -u +%u)
          # EIA's weekly natural gas storage report releases 10:30am ET
          # (EDT, summer) = 14:30 UTC, Thursdays only -- nudge +1h around
          # US DST transitions same as the US opening-range scan above.
          # Wide-ish window (14:30-15:15) since the free bulk download
          # this reads from can lag the official release by a few
          # minutes. NG=F's seasonal setup (see check_watching_commodity()
          # in monitor.py) requires this to have run recently or it
          # refuses to fire at all -- fails closed, not open.
          if [ "${{ github.event.inputs.mode }}" = "eia" ] || { [ "$wd" -eq 4 ] && [ "$now" -ge $((14*60+30)) ] && [ "$now" -lt $((15*60+15)) ]; }; then
            python3 eia_check.py
          else
            echo "Skipping (now=$now UTC, weekday=$wd, not Thursday's release window and mode != eia)"
          fi

      - name: Trade performance report
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          h=$((10#$(date -u +%H))); m=$((10#$(date -u +%M))); now=$((h*60+m))
          # Midnight IST = 18:30 UTC, every day (crypto trades weekends
          # too). report.py's own day_ist logic already treats an
          # hour<6 IST call as "yesterday" for this exact case.
          if [ "${{ github.event.inputs.mode }}" = "report" ] || { [ "$now" -ge $((18*60+30)) ] && [ "$now" -lt $((18*60+45)) ]; }; then
            python3 report.py
          else
            echo "Skipping (now=$now UTC, not in window and mode != report)"
          fi

      - name: Run monitor (full scan)
        if: github.event.inputs.mode != 'report'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 monitor.py

      - name: Commit updated state
        if: always()
        # Always attempt this, even if "Run monitor (full scan)" itself
        # crashed -- a real crash there is worth stopping and flagging
        # (unlike the four auxiliary steps above, deliberately NOT given
        # continue-on-error), but whatever real state.json changes did
        # happen before a mid-run crash should still get saved rather
        # than silently lost.
        run: |
          git config user.name "multi-market-monitor-bot"
          git config user.email "actions@github.com"
          git add state.json "Trade Results.md" 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update state / trade results [skip ci]"
            # With multiple cron triggers firing every ~5 min, overlapping
            # runs racing to push is routine, not rare -- 5 fixed-interval
            # retries could exhaust under real contention. More attempts,
            # randomized backoff (spreads out competing runs instead of
            # them retrying in lockstep), and critically: fail the step
            # (exit 1) if every attempt is exhausted, instead of silently
            # discarding this run's state changes while still reporting
            # "success". A previous version of this loop did exactly that
            # -- its last command on the exhausted path was `sleep`, which
            # exits 0, so a fully-failed push still looked like a clean
            # run with nothing to investigate.
            pushed=false
            for i in $(seq 1 15); do
              if git push; then
                pushed=true
                break
              fi
              echo "Push rejected (attempt $i), pulling and retrying..."
              git pull --rebase origin main
              sleep "$(( (RANDOM % 4) + 1 ))"
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Failed to push state.json after 15 attempts -- this run's state changes were NOT saved."
              exit 1
            fi
          fi
