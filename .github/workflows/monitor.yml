name: Multi-market monitor

on:
  schedule:
    # Every 15 minutes: the regular crypto/US/India monitor loop.
    - cron: "*/15 * * * *"
    # India opening-range scan: 9:15-9:45 IST just closed -> pick the
    # day's top 15 movers. 9:50 IST = 4:20 UTC, weekdays only.
    - cron: "20 4 * * 1-5"
    # US opening-range scan: 9:30-10:00 AM ET just closed (EDT, summer)
    # -> 7:35 PM IST = 14:05 UTC, weekdays only. NOTE: shifts an hour
    # during US winter (EST) -- nudge this cron by +1h around the DST
    # transitions (~early Nov, ~early Mar) if the scan starts firing
    # before the US market actually opens.
    - cron: "5 14 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "monitor / india / us / open / report (for manual testing)"
        required: false
        default: "monitor"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: India opening-range scan
        if: github.event.schedule == '20 4 * * 1-5' || github.event.inputs.mode == 'india'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 rank_movers.py india

      - name: US opening-range scan
        if: github.event.schedule == '5 14 * * 1-5' || github.event.inputs.mode == 'us'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 rank_movers.py us

      - name: Run monitor (open positions only, fast cadence)
        if: github.event.inputs.mode == 'open'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 monitor.py open

      - name: Trade performance report
        if: github.event.inputs.mode == 'report'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 report.py

      - name: Run monitor (full scan)
        if: github.event.inputs.mode != 'open' && github.event.inputs.mode != 'report'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 monitor.py

      - name: Commit updated state
        run: |
          git config user.name "multi-market-monitor-bot"
          git config user.email "actions@github.com"
          git add state.json "Trade Results.md" 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update state / trade results [skip ci]"
            # With 4 cron triggers now firing independently, two runs can
            # occasionally overlap and race to push. Retry with a rebase
            # a few times before giving up, instead of failing outright.
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $i), pulling and retrying..."
              git pull --rebase origin main
              sleep 2
            done
          fi
